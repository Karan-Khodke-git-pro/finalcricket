<div class="viewer-page">
  <div class="container">
    <div class="breadcrumb">
      <a routerLink="/">Home</a><span class="separator"><i class="fas fa-chevron-right"></i></span>
      <span class="current">360° Viewer</span>
    </div>

    <div class="viewer-layout">
      <!-- Main Viewer -->
      <div class="viewer-main">
        <div class="viewer-header">
          <h1>360° Product Viewer</h1>
          <p>Drag to rotate · Scroll to zoom · Use controls below</p>
        </div>

        <div class="viewer-container" #viewerEl
          (mousedown)="onMouseDown($event)"
          (mousemove)="onMouseMove($event)"
          (mouseup)="onMouseUp()"
          (mouseleave)="onMouseUp()"
          (touchstart)="onTouchStart($event)"
          (touchmove)="onTouchMove($event)"
          [class.dragging]="isDragging">
          <img [src]="currentImage" [alt]="selectedProduct?.name || 'Cricket Bat'" [style.transform]="'scale('+zoom+')'">
          <div class="viewer-overlay-hint" *ngIf="!isDragging && currentFrame === 0">
            <i class="fas fa-arrows-alt-h"></i>
            <span>Drag to Rotate</span>
          </div>
          <div class="frame-badge">{{currentFrame + 1}} / {{frames.length}}</div>
        </div>

        <!-- Controls -->
        <div class="viewer-controls">
          <button class="ctrl-btn" (click)="prev()" title="Previous"><i class="fas fa-chevron-left"></i></button>
          <button class="ctrl-btn" (click)="togglePlay()" [class.playing]="isPlaying" title="Auto rotate">
            <i class="fas" [class.fa-play]="!isPlaying" [class.fa-pause]="isPlaying"></i>
          </button>
          <button class="ctrl-btn" (click)="next()" title="Next"><i class="fas fa-chevron-right"></i></button>
          <div class="ctrl-divider"></div>
          <button class="ctrl-btn" (click)="zoomOut()" title="Zoom out" [disabled]="zoom <= 1"><i class="fas fa-search-minus"></i></button>
          <span class="zoom-label">{{(zoom*100).toFixed(0)}}%</span>
          <button class="ctrl-btn" (click)="zoomIn()" title="Zoom in" [disabled]="zoom >= 3"><i class="fas fa-search-plus"></i></button>
          <div class="ctrl-divider"></div>
          <button class="ctrl-btn" (click)="toggleFullscreen()" title="Fullscreen"><i class="fas fa-expand"></i></button>
        </div>

        <!-- Progress dots -->
        <div class="frame-dots">
          <button *ngFor="let f of frames; let i = index" class="dot" [class.active]="i === currentFrame" (click)="currentFrame = i"></button>
        </div>
      </div>

      <!-- Product Selector -->
      <div class="product-selector">
        <h3>Select a Product</h3>
        <div class="product-list">
          <div *ngFor="let p of products" class="prod-item" [class.active]="selectedProduct?.id === p.id" (click)="selectProduct(p)">
            <img [src]="p.thumbnail" [alt]="p.name">
            <div>
              <strong>{{p.name}}</strong>
              <span>₹{{p.price | number}}</span>
            </div>
          </div>
        </div>
        <a *ngIf="selectedProduct" [routerLink]="['/products', selectedProduct.slug]" class="btn btn-accent btn-sm" style="width:100%;margin-top:var(--space-lg)">
          <i class="fas fa-eye"></i> View Full Details
        </a>
      </div>
    </div>
  </div>
</div>
